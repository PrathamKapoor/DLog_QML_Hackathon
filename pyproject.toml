[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlog-qml"
version = "1.0.0"
description = "Quantum learning on a cryptographically hidden coordinate system: a falsifiable study of the discrete-logarithm concept class."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "quantum-machine-learning", "quantum-kernel", "discrete-logarithm",
    "qsvm", "reproducibility", "qiskit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "qiskit>=1.0,<3.0",
    "matplotlib>=3.7,<4.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
# Only needed for the independent FidelityQuantumKernel cross-check.
qml = ["qiskit-machine-learning>=0.7,<1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
dlog-qml-demo = "dlog_qml.cli:demo_main"
dlog-qml-experiment = "dlog_qml.cli:experiment_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
